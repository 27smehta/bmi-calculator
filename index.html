<html>
<head>
    <title>Basic BMI Calculator</title>
</head>
<body>

    <h2>BMI Calculator</h2>

    <p>Weight (kg): <input type="number" id="w"></p>
    <p>Height (m): <input type="number" id="h"></p>
    
    <button onclick="calcBMI()">Calculate</button>

    <p id="result"></p>

    <script>
        function calcBMI() {
            var w = document.getElementById('w').value;
            var h = document.getElementById('h').value;
            
            if (w > 0 && h > 0) {
                var bmi = w / (h * h);
                var category = "";
                
                if (bmi < 18.5) {
                    category = "Underweight";
                } else if (bmi < 25) {
                    category = "Normal weight";
                } else if (bmi < 30) {
                    category = "Overweight";
                } else {
                    category = "Obese";
                }
                
            document.getElementById('result').innerText = `Your BMI is ${bmi.toFixed(1)} (${category})`;
        } else {
            document.getElementById('result').innerText = "Please enter valid numbers.";
        }
            }
    </script>

</body>
</html>
