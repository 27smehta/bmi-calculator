<html>
<head>
    <title>Basic BMI Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h2>BMI Calculator</h2>

    <p>
        System: 
        <select id="units" oninput="calcBMI()">
            <option value="metric">Metric (kg, m)</option>
            <option value="imperial">Imperial (lbs, in)</option>
        </select>
    </p>

    <p><span id="weight-label">Weight (kg):</span> <input type="number" id="w" oninput="calcBMI()"></p>
    <p><span id="height-label">Height (m):</span> <input type="number" id="h" oninput="calcBMI()"></p>
    
    <button class="clear-btn" onclick="clearFields()">Clear</button>

    <p id="result"></p>
    <p id="ideal-weight"></p>
    <script src="script.js"></script>
</body>
</html>
