<html>
<head>
    <title>Basic BMI Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h2>BMI Calculator</h2>

    <p>
        System: 
        <select id="units">
            <option value="metric">Metric (kg, m)</option>
            <option value="imperial">Imperial (lbs, in)</option>
        </select>
    </p>

    <p>Weight: <input type="number" id="w" placeholder="kg or lbs"></p>
    <p>Height: <input type="number" id="h" placeholder="m or inches"></p>
    
    <button onclick="calcBMI()">Calculate</button>

    <p id="result"></p>
    <script src="script.js"></script>
</body>
</html>
